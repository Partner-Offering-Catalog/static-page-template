  repositoryLabel = 'Source'
  repositoryUrl = 'https://github.com/Partner-Offering-Catalog/static-page-template'
  footerNote = 'Built with Hugo for GitHub Pages.'

  [[params.heroStats]]
    label = 'Navigation'
    value = 'Multi-level'
    caption = 'Generated from content folders'

  [[params.heroStats]]
    label = 'Design'
    value = 'Fluent'
