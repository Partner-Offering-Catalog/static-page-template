<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="ms-logo" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
      <span>
        <strong>{{ site.Params.brand | default site.Title }}</strong>
        <small>{{ site.Params.footerNote }}</small>
      </span>
    </div>
    {{ with site.Params.repositoryUrl }}
      <a href="{{ . }}" rel="noreferrer" target="_blank">Source</a>
    {{ end }}
  </div>
</footer>
