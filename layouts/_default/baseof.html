<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}" data-theme-storage-key="static-page-template-theme">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <script>
      (function () {
        var key = document.documentElement.dataset.themeStorageKey;
        var theme = 'light';
        try {
          theme = localStorage.getItem(key) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (error) {}
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
  </head>
  <body>
    <div class="page-shell">
      {{ partial "header.html" . }}
      <div class="content-shell">
        <aside class="sidebar" aria-label="Repository navigation">
          {{ partial "sidebar.html" . }}
        </aside>
        <main id="main-content" class="main-content">
          {{ block "main" . }}{{ end }}
        </main>
      </div>
      {{ partial "footer.html" . }}
    </div>
    <script src="{{ "js/theme.js" | relURL }}"></script>
  </body>
</html>
